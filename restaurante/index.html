<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="description" content="Lissun Food — preço e resultado para restaurantes.">
</head><body>
<title>Lissun Food Restaurante</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: o menu Limpo do Mapa da Reforma (barra escura de altura inteira, rótulos de seção, linhas com ícone,
   ativo com contorno dourado) + barra de topo + área de trabalho; Início no cartão com a jornada em passos.
   Paleta do Mapa: claro = caixas #f3f4f6 e ocre #8a5a00; escuro = Onyx (carvão-azulado + ouro). */
:root{
  --bg:#f7f8f9; --panel:#ffffff; --box:#f3f4f6; --box-2:#e9ecef; --line:#dfe3e8; --line-2:#ced4da;
  --fg:#1f2937; --muted:#5b6573; --faint:#8a94a3;
  --accent:#8a5a00; --accent-2:#c69214; --accent-hi:#9c6a00; --accent-soft:#fbe9b5; --accent-wash:#fbf3dc; --accent-line:#d8b863; --accent-ink:#3d2c00; --icon:#a8820f;
  --btn-fg:#ffffff;
  --sb-bg:#1e293b; --sb-line:rgba(255,255,255,.06); --sb-fg:rgba(255,255,255,.82); --sb-strong:#ffffff; --sb-muted:rgba(255,255,255,.45); --sb-rot:rgba(255,255,255,.38); --sb-hover:rgba(255,255,255,.05); --sb-gold:#ffcc33; --sb-gold-line:rgba(255,204,51,.75); --sb-gold-wash:rgba(255,204,51,.06); --sb-logo:#0c1628;
  --top-bg:#ffffff;
  --ok:#1e7e34; --bad:#c62828; --warn:#8a5a00; --warn-soft:#fbf3dc;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --f-title:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --sb-w:270px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1520; --panel:#162030; --box:#172030; --box-2:#1e2c3e; --line:rgba(184,148,31,.25); --line-2:rgba(255,255,255,.15);
  --fg:#f0e8d0; --muted:rgba(240,232,208,.68); --faint:rgba(240,232,208,.45);
  --accent:#d4a82a; --accent-2:#c69214; --accent-hi:#b8941f; --accent-soft:rgba(201,162,39,.18); --accent-wash:rgba(201,162,39,.08); --accent-line:rgba(201,162,39,.45); --accent-ink:#f4cc4a; --icon:#e0b93a;
  --btn-fg:#1a1300;
  --sb-bg:#04080f; --sb-line:rgba(255,255,255,.06); --sb-fg:rgba(240,232,208,.84); --sb-strong:#f0e8d0; --sb-muted:rgba(240,232,208,.45); --sb-rot:rgba(240,232,208,.36); --sb-hover:rgba(255,255,255,.04); --sb-gold:#ffcc33; --sb-gold-line:rgba(255,204,51,.7); --sb-gold-wash:rgba(255,204,51,.06); --sb-logo:#0c1628;
  --top-bg:#0b111a;
  --ok:#16c47c; --bad:#f84444; --warn:#f4cc4a; --warn-soft:rgba(201,162,39,.12);
  --shadow:0 4px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1520; --panel:#162030; --box:#172030; --box-2:#1e2c3e; --line:rgba(184,148,31,.25); --line-2:rgba(255,255,255,.15);
  --fg:#f0e8d0; --muted:rgba(240,232,208,.68); --faint:rgba(240,232,208,.45);
  --accent:#d4a82a; --accent-2:#c69214; --accent-hi:#b8941f; --accent-soft:rgba(201,162,39,.18); --accent-wash:rgba(201,162,39,.08); --accent-line:rgba(201,162,39,.45); --accent-ink:#f4cc4a; --icon:#e0b93a;
  --btn-fg:#1a1300;
  --sb-bg:#04080f; --sb-line:rgba(255,255,255,.06); --sb-fg:rgba(240,232,208,.84); --sb-strong:#f0e8d0; --sb-muted:rgba(240,232,208,.45); --sb-rot:rgba(240,232,208,.36); --sb-hover:rgba(255,255,255,.04); --sb-gold:#ffcc33; --sb-gold-line:rgba(255,204,51,.7); --sb-gold-wash:rgba(255,204,51,.06); --sb-logo:#0c1628;
  --top-bg:#0b111a;
  --ok:#16c47c; --bad:#f84444; --warn:#f4cc4a; --warn-soft:rgba(201,162,39,.12);
  --shadow:0 4px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--top-bg)}
h1,h2,h3{font-family:var(--f-title);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.2rem;color:var(--accent)} h3{font-size:1.02rem;font-family:var(--f-body);font-weight:600}
p{margin:0;max-width:68ch}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ===== casca ===== */
.casca{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);min-height:100%}
body.rec .casca{--sb-w:68px}

/* ===== menu Limpo (do Mapa) ===== */
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sb-bg);color:var(--sb-fg);padding-bottom:30px;padding-left:env(safe-area-inset-left, 0px);scrollbar-width:thin}
.sb-topo{display:flex;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top, 0px)) 16px 14px;margin-bottom:6px;border-bottom:1px solid var(--sb-line);position:sticky;top:0;background:var(--sb-bg);z-index:2}
.sb-logo{width:36px;height:36px;border-radius:9px;background:var(--sb-logo);border:1px solid rgba(255,204,51,.45);display:grid;place-items:center;color:var(--sb-gold);font-family:var(--f-title);font-weight:600;font-size:15px;flex:none;letter-spacing:.02em}
.sb-nome{line-height:1.2;min-width:0}
.sb-nome b{display:block;color:var(--sb-strong);font-size:14px;font-weight:600;line-height:1.25}
.sb-nome small{color:var(--sb-muted);font-size:11.5px}
.sb-rec{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,204,51,.55);background:transparent;color:var(--sb-gold);font-size:13px;line-height:1;flex:none;display:grid;place-items:center;padding:0;cursor:pointer}
.sb-rec:hover{background:rgba(255,204,51,.12)}
.sb-rot{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sb-rot);padding:16px 22px 6px;white-space:nowrap}
.linha{display:flex;align-items:center;gap:12px;width:calc(100% - 20px);margin:1px 10px;padding:9px 12px;border:1px solid transparent;border-radius:10px;background:none;color:var(--sb-fg);font-size:14px;font-weight:500;text-align:left;white-space:nowrap;cursor:pointer;text-decoration:none}
.linha:hover{background:var(--sb-hover);color:var(--sb-strong)}
.linha .rot{flex:1;overflow:hidden;text-overflow:ellipsis}
.linha .chev{width:14px;height:14px;opacity:.6;transition:transform .5s ease}
.cat.aberta > .linha .chev{transform:rotate(180deg)}
.cat.aberta > .linha,.linha.ativa,.cat.tem-ativa > .linha{border-color:var(--sb-gold-line);color:var(--sb-gold)}
.linha.ativa{background:var(--sb-gold-wash)}
.filhos{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s ease,opacity .5s ease}
.cat.aberta .filhos{grid-template-rows:1fr;opacity:1}
.filhos-in{overflow:hidden;min-height:0}
.cat.aberta .filhos-in{padding:2px 0 6px}
.filho{display:flex;align-items:center;gap:8px;width:calc(100% - 20px);margin:1px 10px;padding:7px 12px 7px 40px;border:1px solid transparent;border-radius:10px;color:var(--sb-fg);opacity:.9;font-size:13.5px;text-decoration:none}
.filho::before{content:'›';color:var(--sb-muted);margin-left:-14px;width:8px}
.filho:hover{color:var(--sb-strong);background:var(--sb-hover)}
.filho.ativa{border-color:var(--sb-gold-line);color:var(--sb-gold);background:var(--sb-gold-wash);opacity:1}
body.rec .sb-nome,body.rec .sb-rot,body.rec .linha .rot,body.rec .linha .chev,body.rec .filhos{display:none!important}
body.rec .linha{justify-content:center;padding:10px 0}
body.rec .sb-topo{flex-direction:column;padding-inline:0}
body.rec .sb-rec{margin:0}

/* ===== topo ===== */
.lado{min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--top-bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.ham{width:38px;height:38px;border-radius:8px;border:0;background:linear-gradient(135deg,#d4a82a,#c69214);color:#1e293b;display:grid;place-items:center;cursor:pointer;flex:none}
.lua{width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none}
.lua:hover{background:var(--accent-wash)}
.chip{height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:8px;border:1px solid var(--accent-line);background:var(--accent-wash);color:var(--accent-ink);font-size:.82rem;font-weight:600}
.seg-sel{height:36px;border-radius:8px;border:1px solid var(--accent-line);background:var(--panel);color:var(--accent);font-weight:600;font-size:.82rem;padding:0 10px}
.topo .dir{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selo{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border:1px solid var(--accent-line);padding:4px 10px;border-radius:999px;font-weight:600}

/* ===== conteúdo ===== */
main{min-width:0;padding-block:18px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.miolo{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.aca{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--accent-line);background:var(--panel);border-radius:999px;padding:4px 12px}
.aca:hover{background:var(--accent-wash)}
.cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cab h1{font-family:var(--f-body);font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg)}
.trilha{font-size:13px;color:var(--muted)} .trilha b{font-weight:500;color:var(--fg)}
.cartao{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.cartao > h2{font-size:1.5rem;color:var(--fg)}
.frase{font-size:1.02rem;color:var(--fg);line-height:1.5;max-width:760px}
.rot-sec{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.caixa{background:var(--box);border:1px solid var(--line);border-radius:10px;padding:18px 21px;display:flex;flex-direction:column;gap:14px}
.pilha{display:flex;flex-direction:column;gap:16px}
.grade{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-size:.82rem;color:var(--fg);font-weight:600}
.campo input,.campo select{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;min-width:0}
.campo input:focus,.campo select:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.ajuda{font-size:.8rem;color:var(--muted)}
.tabela{overflow-x:auto;background:var(--panel);border-radius:8px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th{font-weight:700;text-align:left;background:var(--box-2);padding:9px 10px;white-space:nowrap;border-bottom:2px solid var(--accent-line)}
td{padding:6px 10px;border-top:1px solid var(--line);white-space:nowrap}
td input,td select{width:100%;min-width:90px;background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 6px}
td input:hover,td input:focus,td select:hover{border-color:var(--line-2);background:var(--panel)}
td.num,th.num{text-align:right}
.dre td:first-child{white-space:normal}
.dre tr.neg td:first-child{color:var(--bad)}
.dre tr.tot td{font-weight:700;background:var(--accent-wash);color:var(--accent)}
.btn{border:1px solid var(--accent-line);background:var(--panel);color:var(--accent);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:.88rem;font-weight:600}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-hi));color:var(--btn-fg);border-color:transparent;box-shadow:0 2px 6px rgba(176,123,0,.30)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.linha-acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
main a{color:var(--accent);text-underline-offset:2px;font-weight:500}

.abas{display:flex;gap:6px;flex-wrap:wrap;background:var(--box);border:1px solid var(--line);border-radius:10px;padding:8px}
.abas button{border:1px solid var(--accent-line);background:var(--panel);color:var(--accent);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:.88rem;font-weight:600}
.abas button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--panel);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-left:4px solid var(--accent);box-shadow:var(--shadow)}
.kpi span{font-size:.78rem;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-mono);font-size:1.35rem;font-weight:500;color:var(--faint)}
.grafico{height:180px;border:1px dashed var(--line-2);border-left:3px solid var(--accent);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:.85rem;background:var(--panel)}
.texto-ph{display:flex;flex-direction:column;gap:6px}
.texto-ph i{display:block;height:9px;border-radius:4px;background:var(--box-2)}
details.dobra{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.dobra summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
details.dobra p{margin-top:8px;color:var(--muted);font-size:.88rem}
.vazio{border:1px dashed var(--accent-line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:var(--accent-wash);display:flex;flex-direction:column;gap:10px;align-items:center}

/* Início: passos da jornada e partes da ferramenta (como o Mapa) */
.passos{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr))}
.passo{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.passo .n{font-weight:700;color:var(--accent);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
.passo b{color:var(--fg);font-size:1rem}
.passo span{color:var(--muted);font-size:.88rem;line-height:1.5}
.passo .lk{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:8px}
.passo .lk a{font-size:.86rem;text-decoration:none;font-weight:500}
.passo .lk a:hover{text-decoration:underline}
.partes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:12px;align-items:start}
.pl{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel);min-width:0}
.pl:hover{border-color:var(--accent-line)}
.pl-cab{display:flex;align-items:center;gap:10px}
.pl-cab svg.ic{width:20px;height:20px;color:var(--icon)}
.pl-cab b{font-size:.98rem;font-weight:600;color:var(--fg);flex:1}
.pl-n{font-size:.75rem;color:var(--muted)}
.pl-q{width:22px;height:22px;border-radius:50%;border:1px solid var(--accent-line);background:transparent;color:var(--icon);font-weight:700;font-size:.78rem;padding:0;line-height:20px;flex:none;cursor:pointer}
.pl-q:hover,.pl.mais .pl-q{background:#ffcc33;color:#1e293b;border-color:#ffcc33}
.pl-txt{font-size:.9rem;color:var(--muted);margin:8px 0 0;line-height:1.45}
.pl-mais{margin-top:8px;font-size:.84rem;line-height:1.5;color:var(--fg)}
.pl-mais p{margin:4px 0 0}
.pl-mais ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}

.veu{display:none}
@media (max-width:860px){
  .casca{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:40;transform:translateX(-102%);transition:transform .25s ease}
  body.menu-aberto .sidebar{transform:none}
  body.menu-aberto .veu{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
  .sb-rec{display:none}
  body.rec .casca{--sb-w:270px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== F1: login, estado de salvamento, resultados ===== */
.entrada{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px}
.entrada .card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.entrada .marca-e{display:flex;align-items:center;gap:12px}
.entrada .marca-e .sb-logo{background:#0c1628}
.entrada h1{font-size:1.35rem}
.entrada .msg{font-size:.86rem;border-radius:8px;padding:10px 12px}
.msg.erro{background:color-mix(in srgb, var(--bad) 12%, transparent);color:var(--bad)}
.msg.ok{background:color-mix(in srgb, var(--ok) 12%, transparent);color:var(--ok)}
.msg.info{background:var(--accent-wash);color:var(--accent-ink)}
.usuario{font-size:.8rem;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.salvo{font-size:.78rem;color:var(--muted)}
.salvo.pend{color:var(--accent)}
.salvo.erro{color:var(--bad)}
.calc-barra{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.calc-barra .quando{font-size:.82rem;color:var(--muted)}
.avisos{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.avisos li{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.86rem}
.erros li{background:color-mix(in srgb, var(--bad) 12%, transparent);color:var(--bad)}
.kpi b.v{color:var(--fg)}
.kpi b.v.neg{color:var(--bad)}
.kpi small{font-size:.76rem;color:var(--muted)}
.barras{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:16px}
.barras h3{font-size:.9rem}
.bar-item{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr);gap:10px;align-items:center;font-size:.84rem}
.bar-item .nome{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-trilhos{display:flex;flex-direction:column;gap:3px}
.bar-linha{display:flex;align-items:center;gap:8px}
.bar-linha i{display:block;height:12px;border-radius:3px;min-width:2px}
.bar-linha span{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.c-salao{background:var(--accent)} .c-ifood{background:var(--bad)} .c-whatsapp{background:var(--ok)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:2px;display:inline-block}

// ================= leitura de número digitado (aceita 1.234,56 e 0,48) =================
function num(s){
  if (s == null) return null;
  s = String(s).trim().replace(/\s|R\$|%/g,'');
  if (s === '') return null;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
const fr = (s) => { const n = num(s); return n == null ? null : n / 100; };   // campo em % → fração que o motor espera

function fichaPayload(f){
  const p = { nome: f.nome || 'Ficha sem nome',
    ingredientes: f.ingr.filter(i => i.nome || num(i.qtd) != null).map(i => ({ nome: i.nome || 'Ingrediente', quantidade_liquida: num(i.qtd), unidade: i.un || 'kg', preco_unit: num(i.preco), fator_correcao: num(i.fc) ?? 1 })) };
  if (num(f.ic) != null) p.indice_coccao = num(f.ic);
  if (f.tipo === 'prato' && num(f.porcoes) != null) p.porcoes = num(f.porcoes);
  if (num(f.rend) != null) p.rendimento_kg = num(f.rend);
  return p;
}

function montarEntrada(){
  const e = { segmento: SEGMENTO, operacao: { dias_mes: num(U.dias) } };
  if (U.regime === 'simples') e.regime = { tipo:'simples', rbt12: num(U.rbt12) };
  else if (U.regime === 'manual') e.regime = { tipo:'manual', aliquota_efetiva: fr(U.aliqMan) };
  else e.regime = {};
  e.pagamento = { meios: MEIOS.filter(([k]) => num(U.meios[k].part) != null)
    .map(([k,n]) => ({ nome:n, participacao: fr(U.meios[k].part), taxa: fr(U.meios[k].taxa) ?? 0 })) };
  e.despesas_variaveis = U.dv.filter(d => num(d.pct) != null).map(d => ({ nome: d.nome || 'Despesa variável', pct: fr(d.pct) }));
  e.pessoal = { encargos_pct: fr(U.encargos) ?? 0 };
  if (num(U.prolabore) != null) e.pessoal.prolabore = num(U.prolabore);
  e.pessoal.cargos = U.cargos.filter(c => num(c.sal) != null).map(c => {
    const o = { cargo: c.cargo || 'Cargo', quantidade: num(c.qtd) ?? 1, salario: num(c.sal) };
    if (num(c.benef) != null) o.beneficios = num(c.benef);
    return o; });
  const ex = U.extras.filter(x => num(x.diarias) != null && num(x.valor) != null).map(x => ({ descricao: x.desc || 'Extra', diarias_mes: num(x.diarias), valor_diaria: num(x.valor) }));
  if (ex.length) e.pessoal.extras = ex;
  e.custos_fixos = [];
  GRUPOS.forEach(([g]) => U.fixos[g].forEach(c => { if (num(c.valor) != null) e.custos_fixos.push({ nome: c.nome || 'Custo', valor: num(c.valor), grupo: g }); }));
  e.canais = CANAIS.map(([k,n]) => {
    const c = U.canais[k], o = { id:k, nome:n, participacao: fr(c.part) ?? 0, comissao: fr(c.com) ?? 0 };
    if (num(c.tp) != null) o.taxa_pagamento = fr(c.tp);
    if (num(c.emb) != null) o.embalagem_unit = num(c.emb);
    if (num(c.pedido) != null) o.custo_pedido = num(c.pedido);
    if (num(c.ipp) != null) o.itens_por_pedido = num(c.ipp);
    return o;
  });
  e.meta = U.metaTipo === 'margem' ? { tipo:'margem', valor: fr(U.metaValor) } : { tipo:'lucro', valor: num(U.metaValor) };
  e.politica_preco = U.politica || 'por_canal';
  e.base_rateio = U.base || 'cmv';
  e.arredondamento = { tipo: U.arred || 'centavos' };
  e.linhas = [];
  U.itens.forEach((it, i) => {
    if (!it.nome && !it.forma && num(it.qtd) == null) return;
    const f = FORMAS[it.forma];
    const l = { id:'i'+i, nome: it.nome || ('Item ' + (i+1)), modo: f ? f.modo : '', categoria: f ? f.rot : '', quantidade_mes: num(it.qtd) };
    if (it.cmvOrig === 'ficha'){ const fi = fichaPorId(it.fichaId); if (fi) l.ficha = fichaPayload(fi); }
    else if (it.cmvOrig === 'buffet'){
      if (f && f.modo === 'pessoa') l.consumo_kg_pessoa = num(it.consumo);
      l.buffet = U.buffet.filter(b => b.fichaId && fichaPorId(b.fichaId)).map(b => ({ participacao: fr(b.part) ?? 0, ficha: fichaPayload(fichaPorId(b.fichaId)) }));
    }
    else l.cmv_unit = num(it.custo);
    l.perda_pct = fr(it.perda) ?? 0; l.embalagem_unit = num(it.emb) ?? 0;
    l.tipo_preco = it.tipo === 'fixo' ? 'fixo' : 'calcular';
    if (it.tipo === 'fixo') l.preco = num(it.preco);
    else if (num(it.preco) != null) l.preco_praticado = num(it.preco);
    const mix = {};
    CANAIS.forEach(([k]) => { const v = fr(it['mix_' + k]); if (v != null && v > 0) mix[k] = v; });
    if (Object.keys(mix).length) l.mix_canais = mix;
    if (num(it.peso) != null) l.peso = num(it.peso);
    if (num(it.conc) != null) l.preco_concorrente = num(it.conc);
    if (it.embSalao === 'nao') l.embalagem_so_entrega = true;   // motor 1.3.0: embalagem do item não entra no salão   // pesquisa do consultor; o motor de preço não usa
    e.linhas.push(l);
  });
  return e;
}

function conferirAntes(){
  for (let i = 0; i < U.itens.length; i++){

    if (!it.nome && !it.forma && num(it.qtd) == null) continue;
    if (!it.nome) return `O item da linha ${i+1} do cardápio está sem nome.`;

  }
  return null;
}

function erroAmigavel(msg){
  const m = String(msg || '').match(/(FOOD-[AED]\d+)/);
  if (!m || !ERROS[m[1]]) return String(msg || 'Não foi possível calcular.');
  const nome = (String(msg).match(/"([^"]+)"/) || String(msg).match(/(?:em|canal) ([^ ,]+(?: [^ ,]+)?)$/) || [])[1] || '';
  return ERROS[m[1]].replace('{x}', nome);
}

// --- Preço ideal ---
function precoSint(){
  if (!RES) return semCalculo;
  const r = RES.resultado, d = r.dre, ind = r.indicadores;
  const calc = r.linhas.filter(l => l.tipo_preco === 'calcular');
  const canaisUsados = ordemCanais(RES.canais);
  const maxP = Math.max(1, ...r.linhas.flatMap(l => Object.values(l.precos || {}).map(Number)));
  const frases = calc.slice(0, 6).map(l => {
    const un = l.modo === 'quilo' ? ' o quilo' : l.modo === 'pessoa' ? ' por pessoa' : '';
    return `<p><b>${esc(l.nome)}</b>${un}: ${ordemCanais(l.precos).map(c => `${brl(l.precos[c])} no ${nomeCanal(c)}`).join(', ')}.</p>`;
  }).join('');
  return `<div class="kpis">
      ${kpi('Lucro do mês', brl0(d.lucro), RES.premissas.meta.tipo === 'lucro' ? 'Meta: ' + brl0(RES.premissas.meta.valor) : 'Margem: ' + pctf(d.margem_liquida_pct), d.lucro < 0)}
      ${kpi('Receita do mês', brl0(d.receita_bruta))}
      ${kpi('Markup médio', nf(ind.markup_medio, 2) + '×', 'Receita ÷ custo da comida')}
      ${kpi('Custo da comida sobre a receita', pctf(ind.cmv_pct))}
    </div>
    <div class="barras"><h3>Preço por item e canal</h3>
      <div class="legenda">${canaisUsados.map(c=>`<span><i class="c-${c}"></i>${nomeCanal(c)}</span>`).join('')}</div>
      ${r.linhas.map(l => `<div class="bar-item"><span class="nome" title="${esc(l.nome)}">${esc(l.nome)}</span><div class="bar-trilhos">

// ---------- Diagnóstico rápido ----------
function blocosDiag(){
  const bs = [];
  (PERGUNTAS || []).forEach(q => { let b = bs.find(x => x.id === q.bloco); if (!b) bs.push(b = { id:q.bloco, nome:q.bloco_nome, qs:[] }); b.qs.push(q); });
  return bs;
}
function diagTela(){
  const topo = topoTela('diagnostico','Quinze perguntas curtas para a primeira conversa com o dono. A nota é calculada no servidor e aponta por onde começar o trabalho.');

  const R = U.diag.resp, n = PERGUNTAS.filter(q => R[q.id]).length;
  const perguntas = blocosDiag().map(b => `<div class="caixa"><h2>${esc(b.nome)}</h2>${b.qs.map(q => `<fieldset class="perg"><legend>${esc(q.texto)}</legend>${q.ajuda ? `<p class="ajuda">${esc(q.ajuda)}</p>` : ''}<div class="opcoes">
      ${q.opcoes.concat(q.na_rot ? [{ v:'na', rot:q.na_rot }] : []).map(o => `<label class="op${o.v === 'na' ? ' op-na' : ''}"><input type="radio" name="dq_${q.id}" data-dq="${q.id}" value="${esc(o.v)}"${R[q.id] === o.v ? ' checked' : ''}><span>${esc(o.rot)}</span></label>`).join('')}</div></fieldset>`).join('')}</div>`).join('');
  const barra = `<div class="caixa"><h2>Nota</h2><div class="calc-barra"><button class="btn pri" type="button" data-acao="diagnosticar">Calcular a nota</button>
    <span class="quando">${n} de ${PERGUNTAS.length} respondidas${U.diag.quando ? ' · última nota em ' + dataHoraBR(U.diag.quando) : ''}</span></div>
    <p class="ajuda">Se o restaurante já estiver montado (cardápio, custos, imposto e meta), a nota vem com alertas tirados dos números dele.</p>${U.diag.erro ? `<ul class="avisos erros"><li>${esc(U.diag.erro)}</li></ul>` : ''}</div>`;
  return topo + abasN('diagnostico', ['Perguntas','Resultado'], [perguntas + barra, barra + diagRes()], U.diag.res ? 1 : 0);

function diagRes(){

  return `<div class="kpis">
      ${kpi('Nota geral', D.nota == null ? '—' : D.nota + ' de 100', D.faixa ? D.faixa.rotulo : 'nenhuma pergunta respondida', D.nota != null && D.nota < 40)}
      ${kpi('Respondidas', D.respondidas + ' de ' + D.total, D.nao_se_aplica ? D.nao_se_aplica + ' não se aplica' : '')}
      ${kpi('Pontos de atenção', String(D.pontos_atencao.length), altas + ' de gravidade alta', altas > 0)}
      ${kpi('Alertas dos números', D.numeros_avaliados ? String(D.alertas_numeros.length) : '—', D.numeros_avaliados ? 'tirados do cálculo do restaurante' : 'restaurante ainda não montado', D.alertas_numeros.some(a => a.gravidade === 'alta'))}
    </div>
    ${D.faixa ? `<div class="resumo"><p><b>${esc(D.faixa.rotulo)}</b> (${D.faixa.de} a ${D.faixa.ate} pontos). ${esc(D.faixa.leitura)}</p>${D.completo ? '' : `<p class="ajuda">Faltam ${D.faltam.length} perguntas: a nota vale só para as respondidas.</p>`}</div>` : ''}
    <div class="barras"><h3>Nota por área</h3>${ordem.map(k => { const b = D.blocos[k]; return `<div class="bar-item"><span class="nome">${esc(b.nome)}</span><div class="bar-trilhos"><div class="bar-linha"><i class="${b.nota != null && b.nota < 40 ? 'c-ifood' : 'c-ideal'}" style="width:${b.nota ?? 0}%"></i><span>${b.nota == null ? 'sem resposta' : b.nota + ' de 100'}</span></div></div></div>`; }).join('')}</div>
    <div class="caixa"><h2>Por onde começar</h2>${D.pontos_atencao.length ? `<ol class="pontos">${D.pontos_atencao.map(a => `<li class="g-${a.gravidade}"><span class="selo-g">${a.gravidade === 'alta' ? 'Prioridade alta' : 'Prioridade média'}</span><b>${esc(a.atencao)}</b><small>${esc(a.bloco)} · ${esc(a.pergunta)} Resposta: ${esc(a.resposta)}.</small></li>`).join('')}</ol>` : '<p>Nenhum ponto de atenção nas perguntas respondidas.</p>'}
      <p class="ajuda">A ordem segue o peso de cada pergunta e o quanto a resposta ficou longe da melhor prática.</p></div>
    <div class="caixa"><h2>Alertas dos números</h2>${D.numeros_avaliados
      ? (D.alertas_numeros.length ? `<ul class="avisos">${D.alertas_numeros.map(a => `<li class="${a.gravidade === 'alta' ? 'alto' : ''}">${esc(a.texto)}</li>`).join('')}</ul>` : '<p>Os números do restaurante não acenderam nenhum alerta: preço de hoje no ideal ou acima, e nenhum item com margem negativa num canal.</p>')
      : `<p class="ajuda">${D.erro_numeros ? 'Os números ainda não puderam ser avaliados: ' + esc(erroAmigavel(D.erro_numeros)) : 'Monte o restaurante (cardápio, pessoal e custos, imposto e meta) e calcule a nota de novo para ver os alertas dos números.'}</p>`}</div>
    <p class="ajuda">${esc(D.criterio)}</p>
    <div class="linha-acoes"><a class="btn" href="#proposta">Montar a proposta com este diagnóstico →</a></div>`;
}

async function acaoF3(ac, b){
  const id = b.dataset.id;
  const pedeConfirmacao = ['excluirEmp','excluirVersao','abrirVersao'].includes(ac);
  if (pedeConfirmacao && !b.dataset.conf){ CONFIRMA = ac + ':' + id; mostrar(false); return true; }
  if (ac === 'cancelarConf'){ CONFIRMA = null; mostrar(false); return true; }
  CONFIRMA = null; ERRO_F3 = null;
  if (ac === 'novoEmp'){
    const nome = (document.getElementById('novoEmp').value || '').trim();
    if (!nome){ ERRO_F3 = 'Escreva o nome do restaurante novo.'; mostrar(false); return true; }
    b.disabled = true;
    const r = await sbc.from('empresas').insert({ segmento: SEGMENTO, nome, dados: {} }).select().single();
    if (r.error){ ERRO_F3 = 'Não foi possível cadastrar: ' + r.error.message; mostrar(false); return true; }
    await carregarEmpresas(); await abrirEmpresa(r.data); status('Salvo'); mostrar(false); return true;
  }
  if (ac === 'abrirEmp'){ const e = EMPRESAS.find(x => x.id === id); if (e){ status('Abrindo…','pend'); await abrirEmpresa(e); status('Salvo'); } mostrar(false); return true; }
  if (ac === 'excluirEmp'){
    const { error } = await sbc.from('empresas').delete().eq('id', id);
    if (error) ERRO_F3 = 'Não foi possível excluir: ' + error.message;
    await carregarEmpresas();
    if (CTX.empresa && CTX.empresa.id === id && EMPRESAS[0]) await abrirEmpresa(EMPRESAS[0]);
    mostrar(false); return true;
  }
  if (ac === 'guardarVersao'){
    const nome = (document.getElementById('nomeVersao').value || '').trim();
    if (!nome || /^rascunho$/i.test(nome)){ ERRO_F3 = 'Dê um nome à versão (não pode ser "Rascunho").'; mostrar(false); return true; }
    b.disabled = true;
    const entrada = Object.assign(montarEntrada(), { _tela: U, _calc_em: RES_QUANDO ? RES_QUANDO.toISOString() : null });
    const { error } = await sbc.from('simulacoes').insert({ empresa_id: CTX.empresa.id, nome, entrada, resultado: RES, versao_motor: RES ? RES.versao_motor : null });
    if (error) ERRO_F3 = 'Não foi possível guardar: ' + error.message;
    await carregarSims(); mostrar(false); return true;
  }
  if (ac === 'abrirVersao'){
    const { data, error } = await sbc.from('simulacoes').select('*').eq('id', id).single();
    if (error || !data){ ERRO_F3 = 'Não foi possível abrir a versão' + (error ? ': ' + error.message : '.'); mostrar(false); return true; }
    U = normalizarU(data.entrada && data.entrada._tela);
    RES = data.resultado || null; RES_QUANDO = RES && data.entrada && data.entrada._calc_em ? new Date(data.entrada._calc_em) : null; ERRO_CALC = null;
    await salvar(); status('Versão aberta no rascunho'); mostrar(false); return true;
  }
  if (ac === 'excluirVersao'){
    const { error } = await sbc.from('simulacoes').delete().eq('id', id).neq('nome', 'Rascunho');
    if (error) ERRO_F3 = 'Não foi possível excluir: ' + error.message;
    await carregarSims(); mostrar(false); return true;
  }
  if (ac === 'diagnosticar'){ await diagnosticar(b); return true; }
  if (ac === 'zerarCen'){ U.cenario.aj = {}; mostrar(false); agendarCenario(); return true; }
  if (ac === 'medirRiscos'){ U.riscos.res = null; U.riscos.erro = null; mostrar(false); return true; }
  if (ac === 'medirEstrategias'){ U.estrategias.res = null; U.estrategias.erro = null; mostrar(false); return true; }
  if (ac === 'imprimir'){
    document.body.dataset.imprimir = b.dataset.doc;
    window.print();
    return true;
  }
  return false;
}

function cenarioRes(){
  const C = U.cenario.res;
  if (U.cenario.erro) return `<ul class="avisos erros"><li>${esc(U.cenario.erro)}</li></ul>`;
  if (!C) return '<div class="vazio"><p>Calculando o cenário…</p></div>';
  const P = C.partida.dre, N = C.cenario.dre, d = C.diferenca, mexeu = Object.values(C.ajustes).some(v => Number(v) !== 0);
  const linhas = [['receita_bruta','Receita'],['impostos','(−) Impostos'],['comissoes_canais','(−) Comissões'],['taxas_pagamento','(−) Cartão e PIX'],['despesas_variaveis','(−) Despesas variáveis'],['cmv','(−) Comida'],['embalagens','(−) Embalagens e entrega'],['margem_contribuicao','(=) Margem de contribuição'],['folha','(−) Folha'],['custos_fixos','(−) Custos fixos'],['lucro','(=) Lucro']];
  const veq = C.volume_para_manter_lucro_pct, vm = C.volume_para_meta_pct, ajp = Number(C.ajustes.preco_pct);
  const frases = [];
  if (mexeu) frases.push(`Com essas mudanças, o lucro do mês ${d.lucro >= 0 ? 'sobe' : 'cai'} <b>${brl0(Math.abs(d.lucro))}</b>, de ${brl0(P.lucro)} para ${brl0(N.lucro)}.`);
  if (veq != null && ajp > 0) frases.push(`Com o preço ${pctf(ajp, 0)} maior, as vendas podem cair até <b>${pctf(-veq)}</b> e o lucro ainda fica igual ao de partida (já contando as outras mudanças, menos o volume).`);
  else if (veq != null && mexeu && Math.abs(veq) > 0.0005) frases.push(veq > 0 ? `Para manter o lucro de partida com as outras mudanças, as vendas precisam crescer <b>${pctf(veq)}</b>.` : `Com as outras mudanças, as vendas ainda poderiam cair <b>${pctf(-veq)}</b> mantendo o lucro de partida.`);
  if (vm != null && C.meta && C.meta.tipo === 'lucro') frases.push(vm > 0 ? `Para chegar à meta de ${brl0(C.meta.valor)}, as vendas precisariam crescer ${pctf(vm)}.` : `A meta de ${brl0(C.meta.valor)} fecha mesmo com ${pctf(-vm)} a menos de vendas.`);
  return `<div class="kpis">
      ${kpi('Lucro de partida', brl0(P.lucro), C.base === 'hoje' ? 'com o preço de hoje' : 'com o preço ideal', P.lucro < 0)}
      ${kpi('Lucro no cenário', brl0(N.lucro), (d.lucro >= 0 ? '+' : '') + brl0(d.lucro) + ' por mês', N.lucro < 0)}
      ${kpi('Receita no cenário', brl0(N.receita_bruta), (d.receita >= 0 ? '+' : '') + brl0(d.receita))}
      ${kpi('Ponto de equilíbrio', brl0(C.cenario.indicadores.ponto_equilibrio_receita), 'antes: ' + brl0(C.partida.indicadores.ponto_equilibrio_receita))}
    </div>
    ${frases.length ? `<div class="resumo">${frases.map(f => `<p>${f}</p>`).join('')}</div>` : '<p class="ajuda">Mexa nos controles acima para ver o efeito no mês.</p>'}
    <div class="tabela"><table class="dre"><thead><tr><th>Conta</th><th class="num">Partida</th><th class="num">Cenário</th><th class="num">Diferença</th></tr></thead><tbody>
      ${linhas.map(([k,t]) => { const df = Number(N[k]) - Number(P[k]); return `<tr class="${t.startsWith('(=)') ? 'tot' : t.startsWith('(−)') ? 'neg' : ''}"><td>${t}</td><td class="num">${brl(P[k])}</td><td class="num">${brl(N[k])}</td><td class="num ${Math.abs(df) < 0.005 ? '' : (k === 'lucro' || k === 'margem_contribuicao' || k === 'receita_bruta') ? (df > 0 ? 'pos' : 'neg') : ''}">${Math.abs(df) < 0.005 ? '—' : (df > 0 ? '+' : '') + brl(df)}</td></tr>`; }).join('')}
    </tbody></table></div>
    ${C.avisos && C.avisos.length ? `<ul class="avisos">${C.avisos.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}
    <p class="ajuda">Preço e volume mudam igual em todos os itens e canais. A comissão muda só nos canais que cobram comissão. Volume é decisão sua: a ferramenta não supõe quanto o cliente deixa de comprar quando o preço sobe.</p>`;
}
let tCen = null, seqCen = 0;
function agendarCenario(){ clearTimeout(tCen); const st = document.getElementById('cenStatus'); if (st) st.textContent = 'Calculando…'; tCen = setTimeout(simular, 350); }
async function simular(){
  if (!sbc || !RES) return;
  const meu = ++seqCen;
  // % e pontos de comissão viram fração
  const aj = {}; AJUSTES.forEach(([k]) => { const v = Number(U.cenario.aj[k] || 0); if (v) aj[k] = v / 100; });
  const p = { entrada: montarEntrada(), base: U.cenario.base === 'ideal' || !RES.comparativo ? 'ideal' : 'hoje', ajustes: aj };
  window.__cenEnviado = p;
  const { data, error } = await sbc.rpc('fn_food_cenario', { p });
  if (meu !== seqCen) return;   // chegou resposta de um pedido mais novo
  if (error){ U.cenario.erro = erroAmigavel(error.message); U.cenario.res = null; } else { U.cenario.erro = null; U.cenario.res = data; }
  agendarSalvar();
  const box = document.getElementById('cenRes'); if (box) box.innerHTML = cenarioRes();
  const st = document.getElementById('cenStatus'); if (st) st.textContent = '';
}

async function medir(qual){
  if (!sbc || !RES) return;
  const fn = qual === 'riscos' ? 'fn_food_riscos' : 'fn_food_estrategias', alvo = qual === 'riscos' ? U.riscos : U.estrategias;
  const { data, error } = await sbc.rpc(fn, { p: { entrada: montarEntrada() } });
  if (error){ alvo.erro = erroAmigavel(error.message); alvo.res = null; } else { alvo.erro = null; alvo.res = data; alvo.quando = new Date().toISOString(); }
  agendarSalvar();
  const box = document.getElementById(qual === 'riscos' ? 'riscosRes' : 'estrRes'); if (box) box.innerHTML = qual === 'riscos' ? riscosRes() : estrategiasRes();
}

function mostrar(rolar = true){
  let id = (location.hash || '#inicio').slice(1);

  TELA_ID = id;
  tela.innerHTML = `<div class="miolo">${TELAS[id]()}</div>`;
  tela.querySelectorAll('[data-k]').forEach(i => { const v = getP(U, i.dataset.k); i.value = v == null ? '' : v; });
  sb.querySelectorAll('[data-id]').forEach(a => {
    const on = a.dataset.id === id; a.classList.toggle('ativa', on);
    if (on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  sb.querySelectorAll('.cat').forEach(c => {
    const tem = !!c.querySelector(`[data-id="${id}"]`);
    c.classList.toggle('tem-ativa', tem);
    if (tem){ c.classList.add('aberta'); c.firstElementChild.setAttribute('aria-expanded','true'); }
  });

  if (rolar) window.scrollTo(0, 0);
}

function atualizarDoc(){

  const ar = document.getElementById('areaRelatorio'); if (ar && RES) ar.innerHTML = relatorioDoc();

tela.addEventListener('change', e => {

  if (ds.dq){ U.diag.resp[ds.dq] = e.target.value; agendarSalvar(); const q = tela.querySelector('.calc-barra .quando'); if (q && PERGUNTAS) q.textContent = PERGUNTAS.filter(x => U.diag.resp[x.id]).length + ' de ' + PERGUNTAS.length + ' respondidas'; return; }
  if (ds.cb){ U.cenario.base = ds.cb; agendarCenario(); return; }
  if (ds.es){ const f = U.estrategias.escolhidas, i = f.indexOf(ds.es); if (e.target.checked && i < 0) f.push(ds.es); if (!e.target.checked && i >= 0) f.splice(i, 1); agendarSalvar(); const c = tela.querySelector('#estrRes > .ajuda'); if (c) c.textContent = f.length + (f.length === 1 ? ' estratégia marcada' : ' estratégias marcadas') + ' para o relatório.'; return; }
  if (ds.sv){ const f = U.proposta.fora, i = f.indexOf(ds.sv); if (e.target.checked && i >= 0) f.splice(i, 1); if (!e.target.checked && i < 0) f.push(ds.sv); agendarSalvar(); atualizarDoc(); return; }

});

const pop = document.createElement('div'); pop.className = 'aj-pop'; pop.setAttribute('role', 'dialog'); pop.hidden = true; document.body.appendChild(pop);

function abrirAjuda(btn){
  const a = AJUDA[btn.dataset.aj]; if (!a) return;
  if (popDe === btn) return fecharAjuda();
  pop.innerHTML = `<button class="aj-x" type="button" aria-label="Fechar ajuda">×</button><p><b>O que é</b>${esc(a[0])}</p><p><b>Onde pegar</b>${esc(a[1])}</p><p><b>Como chegar no número</b>${esc(a[2])}</p>`;
  pop.hidden = false; popDe = btn; btn.setAttribute('aria-expanded','true');
  const r = btn.getBoundingClientRect(), w = Math.min(340, window.innerWidth - 32);
  pop.style.width = w + 'px';
  pop.style.left = Math.max(16, Math.min(window.innerWidth - w - 16, r.left + window.scrollX - 12)) + 'px';
  pop.style.top = (r.bottom + window.scrollY + 8) + 'px';
}

tela.addEventListener('click', async e => {
  const q = e.target.closest('.pl-q');
  if (q){ const pl = q.closest('.pl'), m = pl.querySelector('.pl-mais'); m.hidden = !m.hidden; pl.classList.toggle('mais', !m.hidden); q.setAttribute('aria-expanded', !m.hidden); return; }
  const t = e.target.closest('[role="tab"]');
  if (t){
    const [, id, i] = t.id.split('_'); ABAS_MEM[id] = Number(i);
    tela.querySelectorAll('[role="tab"]').forEach(b => b.setAttribute('aria-selected', b === t));
    for (let k=0;k<4;k++){ const p = document.getElementById(`pn_${id}_${k}`); if (p) p.hidden = String(k) !== i; }
    return;
  }
  const b = e.target.closest('[data-acao]'); if (!b) return;
  const ac = b.dataset.acao, i = Number(b.dataset.i), muda = () => { agendarSalvar(); mostrar(false); };
  if (await acaoF3(ac, b)) return;
  const tirar = (lista, fazer) => { lista.splice(i, 1); if (!lista.length) lista.push(fazer()); };
  if (ac === 'addItem'){ U.itens.push(novoItem()); muda(); }
  if (ac === 'rmItem'){ tirar(U.itens, novoItem); muda(); }
  if (ac === 'abrirCanais'){ U.itens[i].aberto = !U.itens[i].aberto; muda(); }
  if (ac === 'addCargo'){ U.cargos.push({cargo:'',qtd:'',sal:'',benef:''}); muda(); }
  if (ac === 'rmCargo'){ tirar(U.cargos, () => ({cargo:'',qtd:'',sal:'',benef:''})); muda(); }
  if (ac === 'addExtra'){ U.extras.push({desc:'',diarias:'',valor:''}); muda(); }
  if (ac === 'rmExtra'){ tirar(U.extras, () => ({desc:'',diarias:'',valor:''})); muda(); }
  if (ac === 'addFixo'){ U.fixos[b.dataset.g].push({nome:'',valor:''}); muda(); }
  if (ac === 'rmFixo'){ U.fixos[b.dataset.g].splice(i, 1); muda(); }
  if (ac === 'addDv'){ U.dv.push({nome:'',pct:''}); muda(); }
  if (ac === 'rmDv'){ tirar(U.dv, () => ({nome:'',pct:''})); muda(); }
  if (ac === 'novaFicha'){ U.fichas.push(novaFicha(b.dataset.tipo)); muda(); }
  if (ac === 'rmFicha'){ U.fichas.splice(i, 1); muda(); }
  if (ac === 'addIng'){ U.fichas[Number(b.dataset.f)].ingr.push(novoIng()); muda(); }
  if (ac === 'rmIng'){ const f = U.fichas[Number(b.dataset.f)]; f.ingr.splice(i, 1); if (!f.ingr.length) f.ingr.push(novoIng()); muda(); }
  if (ac === 'addBuffet'){ U.buffet.push({fichaId:'',part:''}); muda(); }
  if (ac === 'rmBuffet'){ tirar(U.buffet, () => ({fichaId:'',part:''})); muda(); }
  if (ac === 'calcFicha') await calcularFicha(Number(b.dataset.f), b);
  if (ac === 'calcular') await calcular(b);
});

const status = (t, cls='') => { salvoEl.textContent = t; salvoEl.className = 'salvo' + (cls ? ' ' + cls : ''); };
let tSalvar = null;
function agendarSalvar(){ status('Salvando…','pend'); clearTimeout(tSalvar); tSalvar = setTimeout(salvar, 1200); }
async function salvar(){
  if (!sbc || !CTX.sim) return;
  const entrada = Object.assign(montarEntrada(), { _tela: U, _calc_em: RES_QUANDO ? RES_QUANDO.toISOString() : null });
  const { error } = await sbc.from('simulacoes').update({ entrada, resultado: RES, versao_motor: RES ? RES.versao_motor : null }).eq('id', CTX.sim.id);
  if (error) status('Não salvou: ' + error.message, 'erro'); else status('Salvo');
}
async function calcularFicha(fi, btn){
  const f = U.fichas[fi]; if (!f) return;
  if (!sbc){ f.erro = 'Sem conexão com o servidor.'; mostrar(false); return; }
  btn.disabled = true; btn.textContent = 'Calculando…';
  const { data, error } = await sbc.rpc('fn_food_ficha', { p: fichaPayload(f) });
  if (error){ f.erro = erroAmigavel(error.message); f.res = null; } else { f.erro = null; f.res = data; }
  agendarSalvar(); mostrar(false);
}
async function calcular(btn){
  if (!sbc) { ERRO_CALC = 'Sem conexão com o servidor.'; mostrar(false); return; }
  const falta = conferirAntes();
  if (falta){ ERRO_CALC = falta; RES = null; mostrar(false); return; }
  btn.disabled = true; btn.textContent = 'Calculando…';
  const entrada = montarEntrada();
  window.__enviado = entrada;   // para a conferência de ponta a ponta
  const { data, error } = await sbc.rpc('fn_food_calcular', { p: entrada });
  if (error){ ERRO_CALC = erroAmigavel(error.message); RES = null; RES_QUANDO = null; }
  else { ERRO_CALC = null; RES = data; RES_QUANDO = new Date(); ABAS_MEM[TELA_ID] = 1; U.cenario.res = null; U.riscos.res = null; U.estrategias.res = null; }
  await salvar();
  mostrar(false);
}

// ================= entrada (login) =================
const telaEntrada = document.getElementById('entrada');
const eMsg = document.getElementById('eMsg');
const msgEntrada = (t, cls) => { eMsg.textContent = t; eMsg.className = 'msg ' + cls; eMsg.hidden = !t; };
async function carregarConta(user){
  CTX.user = user;
  document.getElementById('usuario').textContent = user.email;
  const { data: acesso, error: eA } = await sbc.rpc('fn_food_tem_acesso', { p_segmento: SEGMENTO });
  if (eA || !acesso){
    telaEntrada.hidden = false;
    msgEntrada('Você entrou como ' + user.email + ', mas o acesso ao Restaurante ainda não foi liberado para esta conta. Assim que for liberado, é só entrar de novo.', 'info');
    return;
  }
  await carregarEmpresas();
  if (!EMPRESAS.length){
    const r = await sbc.from('empresas').insert({ segmento: SEGMENTO, nome: 'Meu restaurante', dados: {} }).select().single();
    if (r.data) EMPRESAS = [r.data];
  }
  let ult = null; try { ult = localStorage.getItem(LS_EMP); } catch(e) {}
  const emp = EMPRESAS.find(x => x.id === ult) || EMPRESAS[0];
  if (emp) await abrirEmpresa(emp);
  telaEntrada.hidden = true;
  status('Salvo');
  mostrar();
}
document.getElementById('formEntrada').addEventListener('submit', async e => {
  e.preventDefault();
  if (!sbc) return msgEntrada('Não foi possível carregar a conexão com o servidor. Confira a internet e recarregue a página.', 'erro');
  const email = document.getElementById('eEmail').value.trim(), senha = document.getElementById('eSenha').value;
  if (!email || senha.length < 6) return msgEntrada('Informe o e-mail e uma senha com pelo menos 6 caracteres.', 'erro');
  msgEntrada('Entrando…', 'info');
  const { data, error } = await sbc.auth.signInWithPassword({ email, password: senha });
  if (error){
    const m = /confirm/i.test(error.message) ? 'Esta conta ainda não foi liberada. Assim que for, é só entrar com este e-mail e senha.'
            : /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : error.message;
    return msgEntrada(m, 'erro');
  }
  msgEntrada('', ''); carregarConta(data.user);
});
document.getElementById('bCriar').addEventListener('click', async () => {
  if (!sbc) return msgEntrada('Não foi possível carregar a conexão com o servidor.', 'erro');
  const email = document.getElementById('eEmail').value.trim(), senha = document.getElementById('eSenha').value;
  if (!email || senha.length < 6) return msgEntrada('Para criar a conta, informe o e-mail e uma senha com pelo menos 6 caracteres.', 'erro');
  const { data, error } = await sbc.auth.signUp({ email, password: senha });
  if (error) return msgEntrada(error.message, 'erro');
  if (data.session) return carregarConta(data.user);
  msgEntrada('Conta criada. Não precisa abrir o e-mail de confirmação: o acesso é liberado pela Lissun e depois você entra com este e-mail e senha.', 'ok');
});
document.getElementById('bSair').addEventListener('click', async () => {
  if (sbc) await sbc.auth.signOut();
  CTX = {user:null, empresa:null, sim:null}; U = vazioU(); RES = null; RES_QUANDO = null; EMPRESAS = []; SIMS = []; PERGUNTAS = null; mostrarChip();
  document.getElementById('usuario').textContent = ''; status('');
  telaEntrada.hidden = false; msgEntrada('', '');
});

// ================= retorno do beta =================
const fb = document.getElementById('fb'), fbMsg = document.getElementById('fbMsg');
const fbAviso = (t, cls) => { fbMsg.textContent = t; fbMsg.className = 'msg ' + cls; fbMsg.hidden = !t; };
document.getElementById('bRetorno').addEventListener('click', () => { fb.hidden = false; fbAviso('', ''); document.getElementById('fbTexto').focus(); });
document.getElementById('fbFechar').addEventListener('click', () => { fb.hidden = true; });
fb.addEventListener('click', e => { if (e.target === fb) fb.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !fb.hidden) fb.hidden = true; });
document.getElementById('fbForm').addEventListener('submit', async e => {
  e.preventDefault();
  const texto = document.getElementById('fbTexto').value.trim();
  if (texto.length < 3) return fbAviso('Escreva o que aconteceu.', 'erro');
  if (!sbc || !CTX.user) return fbAviso('Entre na sua conta para enviar.', 'erro');
  fbAviso('Enviando…', 'info');
  const contexto = { versao_tela: LF_VERSAO, versao_motor: RES ? RES.versao_motor : null, calculado_em: RES_QUANDO ? RES_QUANDO.toISOString() : null, largura: window.innerWidth, navegador: navigator.userAgent, simulacao: CTX.sim ? CTX.sim.id : null };
  const { error } = await sbc.from('feedback').insert({ segmento: SEGMENTO, tela: TELA_ID, tipo: document.getElementById('fbTipo').value, texto, empresa_id: CTX.empresa ? CTX.empresa.id : null, contexto });
  if (error) return fbAviso('Não foi enviado: ' + error.message, 'erro');
  document.getElementById('fbTexto').value = '';
  fbAviso('Recebido. Obrigado: a Lissun lê cada retorno.', 'ok');
});
window.addEventListener('afterprint', () => { delete document.body.dataset.imprimir; });

// ================= menu, tema =================
const celular = () => matchMedia('(max-width:860px)').matches;
document.getElementById('btnHam').addEventListener('click', () => { if (celular()) document.body.classList.toggle('menu-aberto'); else document.body.classList.toggle('rec'); });
document.getElementById('btnRec').addEventListener('click', () => document.body.classList.toggle('rec'));
document.getElementById('veu').addEventListener('click', () => document.body.classList.remove('menu-aberto'));
const raiz = document.documentElement;
const escuroAgora = () => raiz.dataset.theme ? raiz.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
try { const t = localStorage.getItem('lf_tema'); if (t === 'dark' || t === 'light') raiz.dataset.theme = t; } catch(e) {}
document.getElementById('btnTema').addEventListener('click', () => {
  const novo = escuroAgora() ? 'light' : 'dark'; raiz.dataset.theme = novo;
  try { localStorage.setItem('lf_tema', novo); } catch(e) {}
});

window.addEventListener('hashchange', () => mostrar());
mostrar();
if (!sbc) msgEntrada('Não foi possível carregar a conexão com o servidor. Abra o arquivo com internet ligada.', 'erro');
else sbc.auth.getSession().then(({ data }) => { if (data.session) carregarConta(data.session.user); });
})();
</script>
